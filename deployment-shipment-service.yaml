apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-service-deployment
  labels:
    app: shipment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipment-service
  template:
    metadata:
      labels:
        app: shipment-service
    spec:
      containers:
        - name: shipment-container
          image: danijelsudimac/shipment-service:v2
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SERVER_ADDRESS
              value: "0.0.0.0"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_DATA_REDIS_USERNAME
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_DATA_REDIS_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: SPRING_KAFKA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_KAFKA_API_KEY
            - name: SPRING_KAFKA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_KAFKA_API_SECRET
            - name: SPRING_SCHEMA_REGISTRY_URL
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_SCHEMA_REGISTRY_URL
            - name: SPRING_SCHEMA_REGISTRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_SCHEMA_REGISTRY_API_KEY
            - name: SPRING_SCHEMA_REGISTRY_SECRET
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_SCHEMA_REGISTRY_SECRET
            - name: SPRING_DATA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shipment-platform-secrets
                  key: SPRING_DATA_REDIS_URL
---
apiVersion: v1
kind: Service
metadata:
  name: shipment-service
spec:
  type: ClusterIP
  selector:
    app: shipment-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

